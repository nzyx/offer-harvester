<!doctype html>
<html lang="zh-CN">

<meta charset="utf-8">

<style>
  :root{--red:#E60012;--ink:#111;--muted:#8a8a8a}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{display:grid;place-items:center;background:#fff;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  .wrap{text-align:center;padding:24px}
  .mark{font-size:12px;letter-spacing:.42em;color:var(--red);text-transform:uppercase;margin-bottom:20px}
  .t{font-size:24px;font-weight:700;letter-spacing:.02em;margin-bottom:10px}
  .sub{font-size:13px;color:var(--muted);margin-bottom:26px}
  .bar{width:128px;height:2px;background:#eee;margin:0 auto;position:relative;overflow:hidden;border-radius:2px}
  .bar::after{content:"";position:absolute;left:-40%;top:0;height:100%;width:40%;background:var(--red);
    border-radius:2px;animation:slide 1.1s cubic-bezier(.4,0,.2,1) infinite}
  @keyframes slide{0%{left:-40%}100%{left:100%}}
  a{color:var(--muted);font-size:12px;text-decoration:none;border-bottom:1px solid #ddd;padding-bottom:2px}
  a:hover{color:var(--red);border-color:var(--red)}
</style>
